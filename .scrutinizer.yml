build:
  image: default-bionic
  environment:
    php: 8.1.13
  nodes:
    analysis:
      project_setup:
        override:
          - 'true'
      tests:
        override:
          - php-scrutinizer-run
  dependencies:
    override:
      - composer install --ignore-platform-reqs
filter:
  excluded_paths:
    - 'src/Currency.php'
    - 'src/LocaleId.php'
    - 'src/Locale/HasContextTransforms.php'
    - 'src/TerritoryCode.php'
    - 'src/Units/SequenceCompanion.php'
    - 'src/Units/UnitsCompanion.php'
    - 'tests/*'
checks:
  php: true
